<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Content Management | White Impact Admin</title>
    <link rel="stylesheet" href="styles.css?v=20260908-admin-workspace14" />
    <link rel="icon" type="image/png" href="./assets/images/logo.png" />
  </head>
  <body class="admin-app-page" data-page="admin-section">
    <main id="main">
      <section class="section content-admin-section">
        <div class="container content-admin-shell">
          <aside class="admin-panel content-admin-sidebar">
            <div class="content-admin-sidebar-intro">
              <a class="admin-login-brand" href="admin.html">
                <img src="assets/images/logo.png" alt="" />
                <span>White Impact Admin</span>
              </a>
              <p class="section-kicker">Management workspace</p>
              <h1 data-content-admin-title>Content management</h1>
              <p class="section-desc" data-content-admin-help>Manage the selected content collection.</p>
              <p class="admin-panel-status" data-content-admin-status></p>
            </div>
            <div class="content-admin-sidebar-actions">
              <a class="btn btn-primary admin-top-action" href="admin.html" aria-label="Back to dashboard" title="Back to dashboard">
                <span>Dashboard</span>
              </a>
              <button class="btn btn-ghost admin-top-action" type="button" data-content-admin-refresh aria-label="Refresh data" title="Refresh data">
                <span>Refresh</span>
              </button>
            </div>
            <div class="content-admin-sidebar-controls">
              <div class="admin-section-switcher admin-panel content-admin-sidebar">
                <label for="admin-section-select">Switch workspace</label>
                <select id="admin-section-select" data-admin-section-select>
                  <optgroup label="Content">
                    <option value="programs">Programs</option>
                    <option value="projects">Projects</option>
                    <option value="stories">Stories</option>
                    <option value="news">News &amp; insights</option>
                    <option value="reports">Reports</option>
                  </optgroup>
                  <optgroup label="People &amp; engagement">
                    <option value="team">Team members</option>
                    <option value="volunteers">Volunteers</option>
                    <option value="contacts">Contacts</option>
                    <option value="donations">Donations</option>
                    <option value="partners">Partners</option>
                  </optgroup>
                </select>
                <p>Choose a workspace to manage its records.</p>
              </div>
            </div>
          </aside>
          <div class="content-admin-workbench">
            <div class="content-admin-panels" data-content-admin-panels></div>
          </div>
        </div>
      </section>
    </main>
    <script src="api.js?v=20260908-admin-workspace6"></script>
  </body>
</html>
