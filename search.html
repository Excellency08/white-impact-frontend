<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search programs, projects, stories, news, and reports from White Impact Development Initiative."
    />
    <title>Search | White Impact Development Initiative</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="./assets/images/logo.png" />
    <link rel="apple-touch-icon" href="./assets/images/logo.png" />
  </head>
  <body class="inner-page" data-page="search">
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">Home</a> / <span>Search</span>
          </nav>
          <h1>Search the site</h1>
          <p class="page-hero-lead">
            Find programs, projects, stories, news, and reports in one place.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <form class="search-bar" data-search-form>
            <div class="form-group">
              <label for="site-search">Search query</label>
              <input
                id="site-search"
                name="query"
                type="search"
                placeholder="Try education, health, stories, or reports"
              />
            </div>
            <button class="btn btn-primary" type="submit">Search</button>
          </form>

          <div class="section-head" data-animate>
            <p class="section-kicker">Global search</p>
            <h2>Live results</h2>
            <p class="section-desc" data-search-meta>
              Search results will appear here.
            </p>
          </div>

          <div class="search-results" data-search-results></div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="layout.js"></script>
    <script src="api.js?v=20260904-supabase-api"></script>
    <script src="script.js"></script>
  </body>
</html>
